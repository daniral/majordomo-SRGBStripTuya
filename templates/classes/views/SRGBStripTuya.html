<script type="text/javascript">
/**
 * Управление RGB-лентой Tuya в MajorDoMo.
 *
 * Скрипт реализует функции:
 *
 * 1. Управление яркостью:
 *    - Предпросмотр изменения яркости (без отправки на сервер)
 *    - Отправка яркости с задержкой (debounce 500 мс)
 *    - Окрашивание фона ползунка под % яркости
 *
 * 2. Управление цветом:
 *    - Выбор цвета через input[type=color]
 *    - Отправка HEX-значения через setGlobal
 *
 * 3. Управление сценами:
 *    - Загрузка списка сцен из глобальной переменной "scenesList"
 *    - Парсинг формата: "Relax=1,Party=2,Sunset=3"
 *    - Генерация выпадающего списка
 *    - Подсветка активной сцены
 *
 * 4. Синхронизация с сервером:
 *    - Обновление ползунка яркости, если пользователь его не двигает
 *
 * Глобальный объект window.rgbStripTuya{object_id}:
 * @property {number} level                 Текущая яркость
 * @property {boolean} dragging             Флаг удержания ползунка
 * @property {Array<string>} scenes         Список имён сцен
 * @property {string|null} currentSceneName Текущая активная сцена
 */

    // создаём объект для текущей лампы, если его нет
    if (typeof window.rgbStripTuya === 'undefined') window.rgbStripTuya = {};
    if (typeof window.rgbStripTuya%.object_id% === 'undefined') {
        window.rgbStripTuya%.object_id% = {
			level: %.level%,
			workScene: null,
			scenes: {},
			currentSceneName: null,
			dragging: false
        };
    }

	// --- Debounce функции ---
	let levelTimeout%.object_id%;

	// --- Яркость ---
	function previewLevel%.object_id%(val) {
	  val = parseInt(val);
	  window.rgbStripTuya%.object_id%.dragging = true; 
	  window.rgbStripTuya%.object_id%.level = val;
	  $('#rgbStripTuya%.object_id%_leveltxt').text("Яркость: " + val + "%");
	  updateSliderFill('#rgbStripTuya%.object_id%_level', val, '#4CAF50');
	}

	function sendNewLevel%.object_id%() {
	  window.rgbStripTuya%.object_id%.dragging = false;
	  clearTimeout(levelTimeout%.object_id%);
	  levelTimeout%.object_id% = setTimeout(() => {
		  callMethod('%.object_title%.setLevel', 'value=' + window.rgbStripTuya%.object_id%.level);
	  }, 500);
	}

	// --- Обновление фона ползунка ---
	function updateSliderFill(selector, value, color) {
	  const slider = document.querySelector(selector);
	  const percentage = value;
	  slider.style.background = `linear-gradient(90deg, ${color} ${percentage}%, #ddd ${percentage}%)`;
	}
	
    // ================= Цветной свет =================
    function sendNewColor%.object_id%(val) {
        setGlobal('%.object_title%.color', val);
    }

	// ================= Сцены =================
	function populateSceneSelect%.object_id%() {
		const select = document.getElementById('sceneSelect%.object_id%');
		if (!select) return;

		let sceneStr = getGlobal('%.object_title%.scenesList');
		let currentSceneName = getGlobal('%.object_title%.sceneName') || 'none';
		window.rgbStripTuya%.object_id%.currentSceneName = currentSceneName;

		rgbStripTuya%.object_id%.scenes = [];

		if (sceneStr && typeof sceneStr === 'string') {
			sceneStr.split(',').forEach(item => {
				const name = item.split('=')[0].trim();
				if (name) rgbStripTuya%.object_id%.scenes.push(name);
			});
		}

		select.innerHTML = '';

		if (rgbStripTuya%.object_id%.scenes.length === 0) {
			const opt = document.createElement('option');
			opt.disabled = true;
			opt.selected = true;
			opt.textContent = 'Сцен нет';
			select.appendChild(opt);
			return;
		}

		// Добавляем все сцены и подсветку активной
		rgbStripTuya%.object_id%.scenes.forEach(name => {
			const opt = document.createElement('option');
			opt.value = name;
			opt.textContent = name;
			if (name === currentSceneName) {
				opt.selected = true;
				opt.style.background = '#4CAF50';
				opt.style.color = 'white';
			}
			select.appendChild(opt);
		});
	}

	function sendScene%.object_id%(sceneName) {
		if (!sceneName) {
			setGlobal('%.object_title%.sceneName', 'none');
			rgbStripTuya%.object_id%.currentSceneName = null;
			populateSceneSelect%.object_id%();
			return;
		}

		sceneName = sceneName.trim();
		window.rgbStripTuya%.object_id%.currentSceneName = sceneName;
		setGlobal('%.object_title%.sceneName', sceneName);
		populateSceneSelect%.object_id%(); // обновляем подсветку
	}

	// --- Обновление слайдера с сервера ---
	function updateFromServer(level) {
	  if (!window.rgbStripTuya%.object_id%.dragging) { 
		  window.rgbStripTuya%.object_id%.level = level;
		  $('#rgbStripTuya%.object_id%_leveltxt').text("Яркость: " + level + "%");
		  $('#rgbStripTuya%.object_id%_level').val(level);
		  updateSliderFill('#rgbStripTuya%.object_id%_level', level, '#4CAF50');
	  }
	}

	$(document).ready(function() {
        populateSceneSelect%.object_id%();
        updateSliderFill('#rgbStripTuya%.object_id%_level', %.level%, '#4CAF50');
    });
</script>

<style>
/* Стили для карточки */
.card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  margin: 20px 0 20px 50px;
  max-width: 320px;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

/* Стили для яркости и цвета */
.device-details p {
  margin: 8px 0 4px;
  font-weight: 500;
  color: #333;
}

/* Слайдеры */

input[type=range] {
  width: 100%;
  height: 8px;
  border-radius: 5px;
  outline: none;
  background: linear-gradient(90deg, #ddd 0%, #ddd 0%);
  transition: background 0.2s ease;
  -webkit-appearance: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: white;
  border: 3px solid currentColor;
  box-shadow: 0 0 6px rgba(0,0,0,0.3);
  cursor: pointer;
  transition: transform 0.15s ease;
}
input[type=range]::-webkit-slider-thumb:hover {
  transform: scale(1.2);
}
#rgbStripTuya%.object_id%_level {
  color: #4CAF50;
}

/* --- Стили кастомного селекта --- */
.select-wrapper {
  position: relative;
  display: inline-block;
  width: 100%;
  margin-top: 5px;
}

.select-wrapper select {
  width: 100%;
  padding: 6px 16px; 
  border-radius: 10px;
  border: 1px solid #ccc;
  background-color: #f4f4f4;
  font-family: "Segoe UI", sans-serif;
  font-size: 14px;
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}

.select-wrapper select:focus {
  border-color: #4CAF50;
  background-color: #fff;
  outline: none;
}


/* Опционально: плавное изменение фона при наведении */
.select-wrapper select:hover {
  background-color: #eaeaea;
}
</style>
	
<div class="device-widget controller loadtype_%.loadType%">
 <div onClick='$("#icon%.object_id%_light").addClass("pressed");setTimeout("$(\"#icon%.object_id%_light\").removeClass(\"pressed\");",300);callMethod("%.object_title%.switch");'>
  <div class="device-icon %.status|"off;on"%" id="icon%.object_id%_light" style='%.icon|"background-image:url(%.icon%)"%'></div>
  <div class="device-header">%.object_description%</div>
 </div>
</div>

<div class="card">
  <div class="device-details">
	<h5>🎨 Цветной свет</h5>
	<input type="color"  
		   value="%.color%" 
		   onchange="sendNewColor%.object_id%(this.value);">
    <p id="rgbStripTuya%.object_id%_leveltxt">Яркость: %.level%%</p>
    <input id="rgbStripTuya%.object_id%_level" 
           type="range" min="1" max="100" step="1"
           value="%.level%" 
           oninput="previewLevel%.object_id%(this.value)"
           onmouseup="sendNewLevel%.object_id%()"
           ontouchend="sendNewLevel%.object_id%()"> 
  </div>	   
  <div class="select-wrapper">
	<h5>🎭 Сцены</h5>
	<select id="sceneSelect%.object_id%" onchange="sendScene%.object_id%(this.value)">
		<!-- Опции будут сгенерированы динамически -->
	</select>
  </div>
  
</div>

<script>
	// Инициализация фона ползунка и сцен при загрузке
	updateSliderFill('#rgbStripTuya%.object_id%_level', %.level%, '#4CAF50');
	populateSceneSelect%.object_id%();
</script>
